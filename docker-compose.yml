services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: futurekawa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futurekawa}
      POSTGRES_USER: ${POSTGRES_USER:-futurekawa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-futurekawa_secret}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-futurekawa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base dédiée aux tests (isolée, éphémère — n'affecte jamais les données de démo).
  db-test:
    image: timescale/timescaledb:latest-pg16
    container_name: futurekawa-db-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futurekawa}
      POSTGRES_USER: ${POSTGRES_USER:-futurekawa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-futurekawa_secret}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-futurekawa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    container_name: futurekawa-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  node-red:
    image: nodered/node-red:latest
    container_name: futurekawa-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./backend-pays/node-red:/data
    environment:
      - BACKEND_PAYS_URL=${BACKEND_PAYS_URL:-http://backend-pays:3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mqtt

  mailhog:
    image: mailhog/mailhog:latest
    container_name: futurekawa-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  backend-pays:
    build: ./backend-pays
    container_name: futurekawa-backend-pays
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-futurekawa}:${POSTGRES_PASSWORD:-futurekawa_secret}@db:5432/${POSTGRES_DB:-futurekawa}
      MQTT_BROKER_URL: mqtt://mqtt:1883
      MQTT_TOPIC_PREFIX: futurekawa
      SERVICE_API_KEY: ${SERVICE_API_KEY:-changeme}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-FutureKawa <no-reply@futurekawa.local>}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      APP_PUBLIC_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
      mailhog:
        condition: service_started

  app-siege:
    build: ./app-siege
    container_name: futurekawa-app-siege
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-changeme}
      AUTH_URL: http://localhost:3000
      AUTH_API_URL: http://backend-pays:3001
      BACKEND_BRESIL_URL: http://backend-pays:3001
      BACKEND_EQUATEUR_URL: http://backend-pays:3001
      BACKEND_COLOMBIE_URL: http://backend-pays:3001
      SERVICE_API_KEY: ${SERVICE_API_KEY:-changeme}
    depends_on:
      backend-pays:
        condition: service_started

volumes:
  db_data:
  mosquitto_data:
  mosquitto_log:
